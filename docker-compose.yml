services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data                          # SQLite database lives here
      - ./config.yaml:/app/config.yaml:ro     # edit filters without rebuilding
      - ./profile.md:/app/profile.md:ro
    expose:
      - "8000"

  caddy:                                      # HTTPS + your domain, automatic certificates
    image: caddy:2
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
